name: Build FlyWire weight pickles

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_weight_pickles.py'
      - 'data/2025_Connectivity_783.parquet'
      - 'data/2025_Completeness_783.csv'
      - '.github/workflows/build-weights.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Do not use setup-python's `cache: pip` here: this repository has no
      # requirements.txt or pyproject.toml, so setup-python cannot determine
      # a dependency file and fails before the build starts.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pyarrow torch

      - name: Check required source data
        run: |
          test -s data/2025_Connectivity_783.parquet
          test -s data/2025_Completeness_783.csv
          ls -lh data/2025_Connectivity_783.parquet data/2025_Completeness_783.csv

      - name: Build sparse weight pickles
        run: python scripts/build_weight_pickles.py

      - name: Verify outputs
        run: |
          python - <<'PY'
          import pickle
          from pathlib import Path
          for name in ('weight_coo.pkl', 'weight_csr.pkl'):
              p = Path('data') / name
              assert p.exists() and p.stat().st_size > 0, f'Missing {p}'
              with p.open('rb') as f:
                  x = pickle.load(f)
              print(name, type(x), tuple(x.shape), x._nnz())
          PY

      - name: Upload weight pickles
        uses: actions/upload-artifact@v4
        with:
          name: flywire-weight-pickles
          path: |
            data/weight_coo.pkl
            data/weight_csr.pkl
          if-no-files-found: error
          retention-days: 30
